name: Add custom domain (one-shot)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Custom domain to add to birdcut-site'
        required: true

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add domain to Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          echo "=== adding $DOMAIN ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/birdcut-site/domains" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data "{\"name\":\"$DOMAIN\"}"
          echo
          echo "=== current domains ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/birdcut-site/domains" \
            -H "Authorization: Bearer $CF_TOKEN"
          echo
